plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def signingProps = new Properties()
if (signingFile.exists()) { signingFile.withInputStream { signingProps.load(it) } }
android {
    namespace 'com.arcanagaming.mlcalculator'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.arcana.mlcalculator'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '1.1.1'
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0' }
